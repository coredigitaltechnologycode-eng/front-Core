<div class="ingreso-productos">
    <h2>Ingreso de Nuevos Productos</h2>
    <p class="subtitulo">Los campos marcados como SRI son obligatorios para la facturación electrónica.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <!-- =====================================================
         IDENTIFICACIÓN DEL PRODUCTO
    ====================================================== -->
        <fieldset>
            <legend>Identificación</legend>

            <div class="form-row">
                <label>
                    Código principal <span class="badge-sri">SRI</span>
                    <input type="text" formControlName="codigo_principal" placeholder="ej. PROD-001"
                        [class.is-invalid]="isFieldInvalid('codigo_principal')" />
                    <span class="error-msg" *ngIf="isFieldInvalid('codigo_principal')">
                        El código principal es obligatorio (máx. 25 caracteres).
                    </span>
                </label>

                <label>
                    Código auxiliar
                    <input type="text" formControlName="codigo_auxiliar"
                        placeholder="ej. código de barras (opcional)" />
                </label>
            </div>

            <label>
                Descripción <span class="badge-sri">SRI</span>
                <input type="text" formControlName="descripcion" placeholder="ej. Camiseta algodón talla M"
                    [class.is-invalid]="isFieldInvalid('descripcion')" />
                <span class="error-msg" *ngIf="isFieldInvalid('descripcion')">
                    La descripción debe tener entre 3 y 300 caracteres.
                </span>
            </label>

            <label>
                Categoría
                <input type="text" formControlName="categoria" placeholder="ej. Ropa, Electrónica, Abarrotes..."
                    [class.is-invalid]="isFieldInvalid('categoria')" />
                <span class="error-msg" *ngIf="isFieldInvalid('categoria')">
                    La categoría es obligatoria.
                </span>
            </label>
        </fieldset>

        <!-- =====================================================
         PRECIOS E IMPUESTOS
    ====================================================== -->
        <fieldset>
            <legend>Precio e Impuestos</legend>

            <div class="form-row">
                <label>
                    Precio unitario (USD)
                    <input type="number" formControlName="precio_unitario" step="0.01" min="0" placeholder="ej. 12.50"
                        [class.is-invalid]="isFieldInvalid('precio_unitario')" />
                    <span class="error-msg" *ngIf="isFieldInvalid('precio_unitario')">
                        El precio debe ser mayor a 0.
                    </span>
                </label>

                <label>
                    Descuento (%)
                    <input type="number" formControlName="descuento_porcentaje" step="0.01" min="0" max="100" />
                </label>
            </div>

            <label>
                Tarifa de IVA <span class="badge-sri">SRI</span>
                <select formControlName="codigo_iva">
                    <option *ngFor="let tarifa of tarifasIva" [value]="tarifa.codigo">
                        {{ tarifa.etiqueta }}
                    </option>
                </select>
            </label>

            <label class="checkbox-label">
                <input type="checkbox" formControlName="tiene_ice" />
                Este producto tiene ICE (Impuesto a Consumos Especiales)
            </label>

            <div class="precio-preview">
                Precio final con impuestos: <strong>${{ precioConIva.toFixed(2) }}</strong>
            </div>
        </fieldset>

        <!-- =====================================================
         UNIDAD DE MEDIDA E INVENTARIO
    ====================================================== -->
        <fieldset>
            <legend>Unidad e Inventario</legend>

            <label>
                Unidad de medida <span class="badge-sri">SRI</span>
                <select formControlName="unidad_medida">
                    <option *ngFor="let unidad of unidadesMedida" [value]="unidad">{{ unidad }}</option>
                </select>
            </label>

            <div class="form-row">
                <label>
                    Stock inicial
                    <input type="number" formControlName="stock_inicial" min="0" placeholder="ej. 50"
                        [class.is-invalid]="isFieldInvalid('stock_inicial')" />
                    <span class="error-msg" *ngIf="isFieldInvalid('stock_inicial')">
                        El stock inicial es obligatorio.
                    </span>
                </label>

                <label>
                    Stock mínimo (alerta)
                    <input type="number" formControlName="stock_minimo" min="0" placeholder="ej. 5" />
                </label>
            </div>
        </fieldset>

        <button type="submit" [disabled]="isLoading">
            {{ isLoading ? 'Guardando...' : 'Guardar Producto' }}
        </button>

        @if (mensaje) {
        <p [class.error]="huboError" [class.exito]="!huboError">{{ mensaje }}</p>
        }

    </form>
</div>
